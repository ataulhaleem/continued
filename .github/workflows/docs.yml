name: Documentation

on:
  push:
    branches: [main]
    paths: ['documentation/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: documentation } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: documentation/package-lock.json }
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run generate
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
      # Nitro does not copy dotfiles; Pages served through Actions skips Jekyll anyway, but be explicit.
      - run: touch .output/public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: documentation/.output/public }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
