name: Bug Report
description: Report a reproducible problem in Continued
labels: [ bug ]
body:
- type: markdown
  attributes:
    value: |
      Thanks for reporting this. Please include enough detail to reproduce.

- type: textarea
  id: summary
  attributes:
    label: Summary
    description: What went wrong?
    placeholder: Short description of the bug
  validations:
    required: true

- type: textarea
  id: steps
  attributes:
    label: Steps to Reproduce
    description: Exact steps to reproduce the issue
    placeholder: |
      1. Open Plugin Manager
      2. Click ...
      3. Observe ...
  validations:
    required: true

- type: textarea
  id: expected
  attributes:
    label: Expected Behavior
    placeholder: What should happen?
  validations:
    required: true

- type: textarea
  id: actual
  attributes:
    label: Actual Behavior
    placeholder: What actually happened?
  validations:
    required: true

- type: input
  id: extension-version
  attributes:
    label: Continued Version
    placeholder: e.g. 1.0.0

- type: input
  id: vscode-version
  attributes:
    label: VS Code Version
    placeholder: e.g. 1.102.0

- type: input
  id: os
  attributes:
    label: OS
    placeholder: e.g. Linux / macOS / Windows

- type: textarea
  id: logs
  attributes:
    label: Logs / Screenshots
    description: Paste logs or attach screenshots if available
    render: shell
